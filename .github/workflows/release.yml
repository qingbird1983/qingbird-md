name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to rebuild (e.g. v0.1.3)'
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      # dtolnay/rust-toolchain 的 "stable" 是分支而非 tag，pin 分支头快照
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable @ 2026-09-19

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate version sources
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          VERSION="${TAG#v}"
          PKG="$(node -p "require('./package.json').version")"
          TAURI="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          CARGO="$(python -c "import re,pathlib; t=pathlib.Path('src-tauri/Cargo.toml').read_text(encoding='utf-8'); m=re.search(r'^version\s*=\s*\"([^\"]+)\"', t, re.MULTILINE); print(m.group(1) if m else (_ for _ in ()).throw(SystemExit('no version in Cargo.toml')))")"
          echo "tag=${TAG}"
          echo "package.json=${PKG}"
          echo "tauri.conf.json=${TAURI}"
          echo "Cargo.toml=${CARGO}"
          [ "${PKG}" = "${VERSION}" ]
          [ "${TAURI}" = "${VERSION}" ]
          [ "${CARGO}" = "${VERSION}" ]

      - name: Extract release notes from CHANGELOG.md
        shell: bash
        run: |
          python .github/scripts/extract-notes.py \
            --version "${{ steps.tag.outputs.tag }}" \
            --changelog CHANGELOG.md \
            --output "${{ runner.temp }}/release-notes.md"

      - name: Build Tauri
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        with:
          tauriScript: npx tauri

      - name: Rename installer to ASCII filename
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          VERSION="${TAG#v}"
          cd src-tauri/target/release/bundle/nsis
          for f in *.exe; do
            [ -f "$f" ] || continue
            mv "$f" "qingbird-md-setup-${VERSION}-x64.exe"
          done
          ls -la

      - name: Create release and upload
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          body_path: ${{ runner.temp }}/release-notes.md
          files: |
            src-tauri/target/release/bundle/nsis/qingbird-md-setup-*.exe
          fail_on_unmatched_files: true
          generate_release_notes: false

  # SEC-6：依赖漏洞扫描。独立 job、与 release 并行，不阻塞发布；
  # 有漏洞时本 job 变红以供查看。扫描对象是仓库根的 Cargo.lock。
  cargo-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
