name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to rebuild (e.g. v0.1.3)'
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # 本仓库 pnpm-only，lockfileVersion 9.0；本地全局 pnpm 11.5.3 实测安装正常
      # （pnpm 9 会因 pnpm-workspace.yaml 仅含 allowBuilds 而在 store path / install 即炸）
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          # 不用 cache: pnpm：pnpm 9 对本仓库的 pnpm-workspace.yaml（仅 allowBuilds，无 packages）
          # 在 `store path` 阶段即报 packages field missing；Node 依赖缓存收益小，直接跳过

      # dtolnay/rust-toolchain 的 "stable" 是分支而非 tag，pin 分支头快照
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable @ 2026-09-19

      # cargo workspace 根在仓库根（target/ 在根，非 src-tauri/target/）→ 用默认 workspaces
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - run: pnpm install --frozen-lockfile

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate version sources
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          VERSION="${TAG#v}"
          PKG="$(node -p "require('./package.json').version")"
          TAURI="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          CARGO="$(python -c "import re,pathlib; t=pathlib.Path('src-tauri/Cargo.toml').read_text(encoding='utf-8'); m=re.search(r'^version\s*=\s*\"([^\"]+)\"', t, re.MULTILINE); print(m.group(1) if m else (_ for _ in ()).throw(SystemExit('no version in Cargo.toml')))")"
          echo "tag=${TAG}"
          echo "package.json=${PKG}"
          echo "tauri.conf.json=${TAURI}"
          echo "Cargo.toml=${CARGO}"
          [ "${PKG}" = "${VERSION}" ]
          [ "${TAURI}" = "${VERSION}" ]
          [ "${CARGO}" = "${VERSION}" ]

      - name: Extract release notes from CHANGELOG.md
        shell: bash
        run: |
          python .github/scripts/extract-notes.py \
            --version "${{ steps.tag.outputs.tag }}" \
            --changelog CHANGELOG.md \
            --output "${{ runner.temp }}/release-notes.md"

      # 与本地发布流程一致（PowerShell subprocess 不套 PATHEXT 的坑只在本机 agent 环境）
      - name: Build Tauri
        shell: bash
        run: npx tauri build

      - name: Rename installer to ASCII filename
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          VERSION="${TAG#v}"
          # bundle 产物在仓库根 target/（cargo workspace 根），不是 src-tauri/target/
          cd target/release/bundle/nsis
          for f in *.exe; do
            [ -f "$f" ] || continue
            mv "$f" "qingbird-md-setup-${VERSION}-x64.exe"
          done
          ls -la

      - name: Create release and upload
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          body_path: ${{ runner.temp }}/release-notes.md
          files: |
            target/release/bundle/nsis/qingbird-md-setup-*.exe
          fail_on_unmatched_files: true
          generate_release_notes: false

  # SEC-6：依赖漏洞扫描。独立 job、与 release 并行，不阻塞发布；
  # 有漏洞时本 job 变红以供查看。扫描对象是仓库根的 Cargo.lock。
  # 豁免策略在仓库根 audit.toml（先 cp 到 ~/.cargo/——cargo-audit 0.22 只读全局配置，
  # 不读 CWD；本机已实测 0.22.2：CWD/audit.toml 不生效，~/.cargo/audit.toml 生效）。
  cargo-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # 0.22.2 与本机实测同版本；audit-check action 封装不读项目豁免配置，故改为直跑
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Apply project audit policy
        run: cp audit.toml ~/.cargo/audit.toml

      - name: Run cargo audit
        run: cargo audit --file Cargo.lock
