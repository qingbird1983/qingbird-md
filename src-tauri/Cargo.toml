[package]
name = "qingbird-md"
version = "0.1.1"
edition = "2024"
description = "Markdown editor & reader with bilingual EN↔ZH translation (Tauri 2 + Rust core + React/TypeScript UI)"
license = "MIT"
readme = "../../README.md"
repository = "https://github.com/muyan1983/qingbird-md"
homepage = "https://github.com/muyan1983/qingbird-md"
keywords = ["markdown", "translation", "tauri", "editor", "bilingual"]
categories = ["text-editors", "internationalization"]

[lib]
name = "qingbird_md_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "qingbird-md"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dirs = "6.0"
fs2 = "0.4"
hmac = "0.13"
md-5 = "0.11"
pulldown-cmark = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
ureq = "2"
